plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 카카오 REST API 키 — local.properties의 kakao.rest.api.key (git에 올라가지 않음)
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

android {
    namespace 'com.networktracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.networktracker"
        minSdk 29          // Android 10+ — CellInfoNr, foregroundServiceType
        targetSdk 34
        versionCode 2
        versionName "1.1"

        buildConfigField "String", "KAKAO_REST_API_KEY",
                "\"${localProps.getProperty('kakao.rest.api.key', '')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
